version: '3.8'

services:
  app:
    container_name: gen-ui-app
    hostname: gen-ui-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6598:3000"
    environment:
      - NODE_ENV=production
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - NEXT_PUBLIC_COPILOT_CLOUD_API_KEY=${NEXT_PUBLIC_COPILOT_CLOUD_API_KEY}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://172.17.0.1:5000}
    networks:
      - pn-cypher
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #   depends_on:
  #     - app
  #   restart: unless-stopped
  #   profiles:
  #     - production
networks:
  pn-cypher:
    external: true
